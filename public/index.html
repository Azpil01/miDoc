<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Agenda Clínica</title>
    <link rel="stylesheet" href="styles.css?=1.3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alata&family=Kedebideri:wght@400;500;600;700;800;900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Noto+Sans+Display:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="images/FaviCon2.png" type="image/png">
</head>

<body>
    <div class="header">
        <div class="logo">
            <a href="#">
                <img src="images/agendaC1.png" alt="Logo de Agenda Clínica">
            </a>
        </div>
        <nav class="nav-links">
            <a href="#">Especialidades</a>
            <a href="#">Catálogo de Doctores</a>
            <a href="#">Nosotros</a>
            <a href="#">Preguntas Frecuentes</a>
        </nav>
        <div class="user-login-btns">
            <a href="register.html">
                <button class="btn-login-r">Regístrate</button> </a>
                <h2 class="vertical-line">|</h2>
            <a href="register.html">
                <button class="btn-login-l">Inicia Sesión</button>
            </a>
        </div>

    </div>

    <section class="hero">
        <div class="hero-content">
            <h1>Estás en buenas manos, estas en <br> <span>Mi Agenda Clínica</span></h1>
            <p>Encuentra y reserva cita con los mejores especialistas de México</p>
        </div>

        <div class="search-bar">
            <form id="search-form" action="">
                <div class="input-group">
                    <span class="input-icon">📍</span>
                    <input id="input-ubicacion" type="text" placeholder="Buscar por ubicación">
                </div>
                <div class="search-divider"></div>
                <div class="input-group">
                    <span class="input-icon">🩺</span>
                    <input id="input-especialidad" type="text" placeholder="Buscar especialidad">
                </div>
                <button class="btn-search">Buscar</button>
            </form>
        </div>

    </section>

    <main class="main-container">
        <h2>Especialistas Disponibles</h2>
        <div id="doctores-container"></div>
    </main>


    <footer>
        <p>&copy; 2026 Agenda Clínica. Todos los derechos reservados. Desarrollado con ❤️</p>
    </footer>


    <script src="app.js?v=1.2"></script>
</body>

</html>
